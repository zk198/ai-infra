include:
  - ../rag-ingestion/docker-compose.yml
  - ../rag-indexer/compose.yaml
  - ../rag-retrieval/compose.yaml
  - ../ai-gateway/compose.yaml
  - ../agent-core/docker-compose.yml
  - ../agent-tools-web/docker-compose.yml
  - ../agent-tools-code/docker-compose.yml
  - ../ai-ui/compose.yaml

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  agent-core:
    environment:
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-http://llm-gateway:8080/v1}
      AGENT_MCP_SERVER_NAMES: ${AGENT_MCP_SERVER_NAMES:-web,code,rag}
      AGENT_MCP_SERVERS: ${AGENT_MCP_SERVERS:-http://agent-tools-web:8001/mcp,http://agent-tools-code:8001/mcp,http://ai-gateway:8200/mcp/}
      AGENT_LAYA_URL: ${AGENT_LAYA_URL:-http://laya:8000}

volumes:
  qdrant-data:
