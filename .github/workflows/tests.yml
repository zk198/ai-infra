name: tests
# Full AI composition validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --extra test
      - run: uv run pytest
      - name: Checkout service repositories for Compose include validation
        run: |
          git clone --depth 1 https://github.com/zk198/rag-ingestion.git ../rag-ingestion
          git clone --depth 1 https://github.com/zk198/rag-indexer.git ../rag-indexer
          git clone --depth 1 https://github.com/zk198/rag-retrieval.git ../rag-retrieval
          git clone --depth 1 https://github.com/zk198/ai-gateway.git ../ai-gateway
          git clone --depth 1 https://github.com/zk198/agent-core.git ../agent-core
          git clone --depth 1 https://github.com/zk198/agent-tools-web.git ../agent-tools-web
          git clone --depth 1 https://github.com/zk198/agent-tools-code.git ../agent-tools-code
          git clone --depth 1 https://github.com/zk198/ai-ui.git ../ai-ui
          git clone --depth 1 https://github.com/zk198/laya.git ../laya
      - name: Validate stack health script syntax
        run: |
          sh -n scripts/check-stack-health.sh
      - name: Validate integrated Compose
        env:
          RAG_JWT_SECRET: ci-test-secret
        run: docker compose config
      - name: Validate optional Laya Compose
        env:
          RAG_JWT_SECRET: ci-test-secret
          LAYA_ENABLED: "true"
        run: docker compose -f compose.yaml -f compose.laya.yaml config
      - name: Validate optional LLM Compose when sibling repos are available
        env:
          RAG_JWT_SECRET: ci-test-secret
          BIFROST_ENCRYPTION_KEY: ci-test-encryption-key
          SGLANG_API_KEY: local
        run: |
          if [ -f ../llm-gateway/docker-compose.yml ] && [ -f ../llm-inference/docker-compose.yml ]; then
            docker compose -f compose.yaml -f compose.llm.yaml config
          else
            echo "Skipping optional LLM Compose validation; private LLM sibling repositories are not present in this CI workspace."
          fi
